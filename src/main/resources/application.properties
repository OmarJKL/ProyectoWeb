# Lambda Shield - Sistema de Deteccion de Fraude Bancario
spring.application.name=lambda-shield
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# =============================================
# Base de datos - PostgreSQL
# Esquema: backend/entity/PostgreSQL/BD-Desarrollo web.sql
# Ejecutar el script SQL en la BD antes de arrancar con ddl-auto=validate
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/lambda_shield
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false