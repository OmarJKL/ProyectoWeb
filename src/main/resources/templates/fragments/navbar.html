<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="navbar(paginaActiva)" class="navbar navbar-expand-lg navbar-utp px-4 py-3 mb-5">
        <a class="navbar-brand fw-bold" th:href="${session.rol == 'CLIENTE'} ? @{/operacion} : @{/}">
            <i class="bi bi-shield-lock-fill text-danger"></i> LAMBDA SHIELD
        </a>

        <!-- BOTÓN HAMBURGUESA -->
        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarPrincipal"
            aria-controls="navbarPrincipal"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
                
        <div class="collapse navbar-collapse" id="navbarPrincipal">
            <ul class="navbar-nav me-auto ms-4">
                <!-- Enlaces para el Administrador / Analista -->
                <th:block th:if="${session.rol != 'CLIENTE'}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'inicio' ? 'active' : ''}" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'simulador' ? 'active' : ''}" th:href="@{/simulador}">Simulador</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'transacciones' ? 'active' : ''}" th:href="@{/transacciones}">Transacciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'reglas' ? 'active' : ''}" th:href="@{/reglas}">Motor de Reglas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'reportes' ? 'active' : ''}" th:href="@{/reportes}">
                            <i class="bi bi-file-earmark-bar-graph"></i> Reportes
                        </a>
                    </li>
                </th:block>

                <!-- Enlaces para el Usuario Estándar (Cliente) -->
                <th:block th:if="${session.rol == 'CLIENTE'}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'operacion' ? 'active' : ''}" th:href="@{/operacion}">
                            <i class="bi bi-send-fill text-danger"></i> Realizar Transferencia
                        </a>
                    </li>
                </th:block>
            </ul>

            <div class="d-flex align-items-center gap-3 flex-column flex-lg-row">
                <span class="text-secondary small d-none d-md-inline" th:if="${session.nombreUsuario != null}">
                    <span class="badge me-1"
                          th:classappend="${session.rol == 'CLIENTE' ? 'bg-secondary' : 'bg-danger'}"
                          th:text="${session.rol == 'CLIENTE' ? 'Cliente' : 'Administrador'}">Admin</span>
                    <span th:text="${session.nombreUsuario}">Usuario</span>
                </span>
                <a th:href="@{/logout}" class="btn btn-secundario btn-sm" id="btnCerrarSesion">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>
</body>
</html>
