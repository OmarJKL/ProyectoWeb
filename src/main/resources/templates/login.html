<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Lambda Shield</title>
    <link rel="icon" th:href="@{/img/logo.ico}" type="image/ico">

    <!-- Bootstrap, Iconos y Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="tarjeta-ls p-4 shadow" style="max-width: 380px; width: 100%; border-top: 4px solid var(--rojo-acento);">
        
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill fs-1" style="color: var(--rojo-acento);"></i>
            <h3 class="fw-bold mt-2 mb-0">Lambda Shield</h3>
            <p class="text-secondary small text-uppercase" style="letter-spacing: 0.05em;">Acceso al motor antifraude</p>
        </div>

        <!-- Caja de error visible si falló la autenticación -->
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2 fs-6" style="background-color: var(--rojo-tenue); border-color: var(--riesgo-critico); color: var(--riesgo-critico);" id="errorLogin">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span style="font-size: 0.85rem;">Usuario o contraseña incorrectos.</span>
        </div>

        <form th:action="@{/login}" method="post" id="formAcceso">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="usuario" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="clave" name="clave" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-principal w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--borde) !important;">
            <div class="text-secondary small mb-1">
                <i class="bi bi-shield-check text-danger"></i> <strong>Administrador:</strong> admin / lambda2026
            </div>
            <div class="text-secondary small">
                <i class="bi bi-person-fill text-secondary"></i> <strong>Usuario Estándar:</strong> usuario / cliente123
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
