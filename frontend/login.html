<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Lambda Shield</title>

    <!-- Si ya hay sesión activa, no tiene sentido ver el login -->
    <script src="verificacion.js"></script>
    <script>
        if (sessionStorage.getItem(LS_AUTH_KEY) === 'true') {
            window.location.replace('index (1).html');
        }
    </script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Estilos propios -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>

    <div class="ls-login-wrap">
        <div class="ls-card ls-login-card">

            <div class="ls-login-brand">
                <span class="ls-brand-mark"><i class="bi bi-shield-lock-fill"></i></span>
                <div class="ls-brand-name">Lambda Shield</div>
                <div class="ls-brand-sub">Acceso al motor antifraude</div>
            </div>

            <div class="ls-login-error" id="loginError">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Usuario o contraseña incorrectos.</span>
            </div>

            <form id="formLogin" class="ls-form" novalidate>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="loginUser" autocomplete="username" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPass" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn ls-btn-accent w-100 mt-3">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                </button>
            </form>

            <p class="ls-login-hint">Demo: usuario <strong>admin</strong> · contraseña <strong>lambda2026</strong></p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const errorBox = document.getElementById('loginError');

            if (lsLogin(user, pass)) {
                sessionStorage.setItem(LS_AUTH_KEY, 'true');
                window.location.replace('index (1).html');
            } else {
                errorBox.classList.add('show');
            }
        });
    </script>
</body>
</html>
