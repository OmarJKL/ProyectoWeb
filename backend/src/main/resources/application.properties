# Lambda Shield - Sistema de Deteccion de Fraude Bancario
spring.application.name=lambda-shield
server.port=8080

# Salud: solo el estado agregado, sin detalles de la base ni del entorno
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# =============================================
# Base de datos - PostgreSQL
# Esquema: backend/src/main/resources/db/postgresql/BD-Desarrollo web.sql
# Ejecutar el script SQL en la BD antes de arrancar con ddl-auto=validate
# Credenciales: archivo .env en la raiz del repositorio (DB_USER, DB_PASSWORD)
# =============================================
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lambda_shield}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
